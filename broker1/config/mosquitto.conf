# 리스너마다 인증/ACL 설정을 따로 쓰기 위해 필요
per_listener_settings true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# 배치(300) 확인 대기 중에도 브로커가 계속 보낼 수 있도록 inflight를 배치 크기보다 크게 둔다.
# queue는 목표 장애 시간(60초) x 처리량(1,000 msg/s)을 담을 수 있는 크기. 근거는 ADR 참고.
max_inflight_messages 600
max_queued_messages 60000

# 1) 익명 허용 - 기본 pub/sub 실습
listener 1883
allow_anonymous true

# 2) 인증 + ACL - 보안 실습
listener 1884
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# 3) WebSocket - 브라우저 클라이언트 실습
listener 9001
protocol websockets
allow_anonymous true
