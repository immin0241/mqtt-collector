openapi: 3.0.3
info:
  title: StructWatch 경보 API
  version: 0.1.0
  description: |
    경보 규칙 등록과 경보 상태 변경. 조회는 DB 기준이다. (ADR-0010)

    - 인증: IdP(Logto)가 발급한 조직 토큰(Bearer). 조직이 테넌트를 정한다.
    - 권한: 규칙 등록·수정은 `alert-rules:write`(관리자), 경보 상태 변경은 `alerts:transition`(운영자). 조회는 인증만 필요하다.
    - 새 규칙은 수집 쪽 규칙 로더가 다시 읽는 주기(기본 10초) 안에 평가에 반영된다.
servers:
  - url: /
security:
  - bearer: []
paths:
  /v1/alert-rules:
    get:
      summary: 내 조직의 경보 규칙 목록
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Rule" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: 경보 규칙 등록 (scope alert-rules:write)
      description: |
        `sensor_id` 와 `sensor_type` 중 정확히 하나를 준다.
        `kind=threshold` 는 `operator`(gt/lt)가 필요하고 `window_seconds` 를 쓰지 않는다.
        `kind=rate_of_change` 는 `window_seconds` 가 필요하고 `operator` 를 쓰지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleCreate" }
            example:
              name: 균열 폭 5mm 초과
              sensor_type: crack
              metric: crack_width
              kind: threshold
              operator: gt
              threshold: 5
              severity: critical
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "400": { description: 잘못된 JSON }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: 값이 규칙 제약을 어기거나, 다른 조직의 센서를 지정함 }
  /v1/alert-rules/{id}:
    patch:
      summary: 규칙의 이름·임계치·심각도·사용 여부 수정 (scope alert-rules:write)
      description: 규칙의 의미(kind, metric, 대상)를 바꾸려면 새 규칙을 만들고 기존 규칙을 `enabled=false` 로 한다. 경보 이력이 규칙을 참조하므로 삭제는 제공하지 않는다.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RulePatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 규칙이 없거나 다른 조직의 것 }
  /v1/alerts:
    get:
      summary: 내 조직의 경보 목록 (최신순)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, in_progress, resolved] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Alert" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/alerts/{id}/transition:
    post:
      summary: 경보 상태 전이 (scope alerts:transition)
      description: |
        미확인(open) → 조치 중(in_progress) → 조치 완료(resolved) 순서만 허용한다.
        조건부 UPDATE 이므로 같은 경보를 동시에 처리하려는 요청 중 하나만 200 을 받고 나머지는 409 를 받는다.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, enum: [in_progress, resolved] }
      responses:
        "200": { description: 전이됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 경보가 없거나 다른 조직의 것 }
        "409": { description: 현재 상태에서 그 전이를 할 수 없음(이미 처리됨 포함). current_status 를 돌려준다 }
        "422": { description: to 값이 올바르지 않음 }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Unauthorized: { description: 토큰이 없거나 유효하지 않음 }
    Forbidden: { description: 조직이 등록되지 않았거나 필요한 scope 가 없음 }
  schemas:
    Rule:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        sensor_id: { type: integer }
        sensor_type: { type: string, enum: [tilt, crack, env] }
        metric: { type: string, enum: [tilt_x, tilt_y, crack_width, temperature] }
        kind: { type: string, enum: [threshold, rate_of_change] }
        operator: { type: string, enum: [gt, lt] }
        threshold: { type: number }
        window_seconds: { type: integer }
        severity: { type: string, enum: [info, warning, critical] }
        enabled: { type: boolean }
    RuleCreate:
      type: object
      required: [name, metric, kind, threshold]
      properties:
        name: { type: string }
        sensor_id: { type: integer }
        sensor_type: { type: string, enum: [tilt, crack, env] }
        metric: { type: string, enum: [tilt_x, tilt_y, crack_width, temperature] }
        kind: { type: string, enum: [threshold, rate_of_change] }
        operator: { type: string, enum: [gt, lt] }
        threshold: { type: number }
        window_seconds: { type: integer, minimum: 1 }
        severity: { type: string, enum: [info, warning, critical], default: warning }
    RulePatch:
      type: object
      properties:
        name: { type: string }
        threshold: { type: number }
        severity: { type: string, enum: [info, warning, critical] }
        enabled: { type: boolean }
    Alert:
      type: object
      properties:
        id: { type: integer, format: int64 }
        rule_id: { type: integer, format: int64 }
        rule_name: { type: string }
        severity: { type: string }
        sensor_id: { type: integer }
        seq: { type: integer, format: int64 }
        value: { type: number }
        status: { type: string, enum: [open, in_progress, resolved] }
        created_at: { type: string, format: date-time }
        status_changed_at: { type: string, format: date-time }
        changed_by: { type: string }
