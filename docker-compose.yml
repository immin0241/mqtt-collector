services:
  # 최초 1회: 비밀번호 파일 생성 (학습용 계정)
  init:
    image: eclipse-mosquitto:2
    user: root
    volumes:
      - ./broker1/config:/cfg
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rm -f /cfg/passwd && touch /cfg/passwd
        mosquitto_passwd -b /cfg/passwd admin  admin123
        mosquitto_passwd -b /cfg/passwd sensor sensor123
        mosquitto_passwd -b /cfg/passwd viewer viewer123
        chown 1883:1883 /cfg/passwd && chmod 0700 /cfg/passwd
    restart: "no"

  # 메인 브로커: 1883(익명) / 1884(인증+ACL) / 9001(WebSocket)
  broker1:
    image: eclipse-mosquitto:2
    container_name: broker1
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      # 인증이 없거나 약한 서비스는 호스트 로컬에만 연다. 공개 호스트에서도 바깥으로 노출되지 않게 한다.
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:1884:1884"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./broker1/config:/mosquitto/config
      - broker1-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6

  # mosquitto_pub / mosquitto_sub 를 실행할 클라이언트 컨테이너
  client:
    image: eclipse-mosquitto:2
    container_name: client
    entrypoint: ["sleep", "infinity"]
    depends_on: [broker1]

  postgres:
    image: timescale/timescaledb:latest-pg18
    container_name: app-postgres
    environment:
      POSTGRES_DB: go
      POSTGRES_USER: go
      POSTGRES_PASSWORD: go
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U go" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 스키마 마이그레이션 (golang-migrate). 끝나면 종료한다.
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://go:go@postgres:5432/go?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # 개발 시드 + 워커 role (seeds/*.sql, 파일명 순서, 멱등). 마이그레이션 뒤에 실행된다.
  seed:
    image: timescale/timescaledb:latest-pg18
    environment:
      PGHOST: postgres
      PGUSER: go
      PGPASSWORD: go
      PGDATABASE: go
      APP_WORKER_PASSWORD: ${APP_WORKER_PASSWORD:-worker}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
      API_DB_PASSWORD: ${API_DB_PASSWORD:-api}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:-mcp}
    volumes:
      - ./seeds:/seeds:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /seeds/*.sql; do
          echo "applying $$f"
          psql -v ON_ERROR_STOP=1 -v worker_password="$$APP_WORKER_PASSWORD" -v grafana_password="$$GRAFANA_DB_PASSWORD" -v api_password="$$API_DB_PASSWORD" -v mcp_password="$$MCP_DB_PASSWORD" -f "$$f"
        done
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  app:
    build: .
    restart: on-failure
    env_file:
      - .env
    depends_on:
      broker1:
        condition: service_healthy
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  # 경보 규칙·상태 변경 API (Swagger UI: http://localhost:8080/docs). 수집 앱과 별도 프로세스·별도 DB role. (ADR-0010)
  # 인증은 Logto 조직 토큰. 발급자·JWKS 주소는 Logto 설정에 맞춰야 한다. docs/logto-grafana-setup.md 참고.
  api:
    build: .
    command: ["./api"]
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      API_DATABASE_URL: host=postgres user=app_api password=${API_DB_PASSWORD:-api} dbname=go port=5432 sslmode=disable
      API_JWKS_URL: ${API_JWKS_URL:-http://logto:3001/oidc/jwks}
      API_ISSUER: ${API_ISSUER:-http://localhost:3001/oidc}
      # 토큰의 scope 이름. 기본값은 전용 scope, Logto 기본 조직 권한으로 쓰려면 manage:tenant / write:data
      API_SCOPE_RULES_WRITE: ${API_SCOPE_RULES_WRITE:-alert-rules:write}
      API_SCOPE_ALERTS_TRANSITION: ${API_SCOPE_ALERTS_TRANSITION:-alerts:transition}
    depends_on:
      seed:
        condition: service_completed_successfully
      logto:
        condition: service_healthy

  # 테넌트 일일 리포트용 읽기 전용 MCP 서버 (http://localhost:8090/mcp). 별도 프로세스, 도구는 읽기 전용. (ADR-0014)
  # 테넌트별 DB role(mcp_tenant_<id>)은 scripts/provision_mcp_tenant.sh 로 만든다. 같은 MCP_ROLE_SECRET 을 써야 한다.
  # 원격 커넥터는 HTTPS 가 필요하다. 이 서비스는 평문 HTTP 이므로 TLS 종단은 앞단(reverse proxy)에서 한다.
  mcp:
    build: .
    command: ["./mcp"]
    restart: on-failure
    ports:
      - "8090:8090"
    environment:
      MCP_DATABASE_URL: host=postgres user=app_mcp password=${MCP_DB_PASSWORD:-mcp} dbname=go port=5432 sslmode=disable
      MCP_DB_HOST: postgres
      MCP_ROLE_SECRET: ${MCP_ROLE_SECRET:-dev-only-mcp-role-secret-change-me}
      MCP_JWKS_URL: ${MCP_JWKS_URL:-http://logto:3001/oidc/jwks}
      MCP_ISSUER: ${MCP_ISSUER:-http://localhost:3001/oidc}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-http://localhost:8090/mcp}
      MCP_METADATA_URL: ${MCP_METADATA_URL:-http://localhost:8090/.well-known/oauth-protected-resource}
      MCP_REPORT_TZ: ${MCP_REPORT_TZ:-Asia/Seoul}
      MCP_SCOPE_REPORTS_READ: ${MCP_SCOPE_REPORTS_READ:-reports:read}
    depends_on:
      seed:
        condition: service_completed_successfully
      logto:
        condition: service_healthy

  # 수집 경로 지표 (app:9090/metrics). UI는 http://localhost:9091
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: [app]

  emulator:
    build:
      context: mqtt_emulator
      args:
        MQTT_HOST: broker1
        MQTT_PORT: 1883
    restart: "no"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 10

  # 센서 1개 = 컨테이너 1개 (profile: sensors). docker kill -> LWT, docker stop -> 정상 종료
  sensor-101: &sensor
    profiles: ["sensors"]
    build:
      context: mqtt_emulator
      args:
        MQTT_HOST: broker1
        MQTT_PORT: 1883
    command: ["python", "run_sensor.py"]
    restart: "no"
    environment: &sensor-env
      MQTT_HOST: broker1
      MQTT_PORT: "1883"
      INTERVAL_SECONDS: "1.0"
      SENSOR_ID: "101"
      SENSOR_TYPE: tilt
    depends_on:
      broker1:
        condition: service_healthy

  sensor-102:
    <<: *sensor
    environment:
      <<: *sensor-env
      SENSOR_ID: "102"
      SENSOR_TYPE: crack

  sensor-103:
    <<: *sensor
    environment:
      <<: *sensor-env
      SENSOR_ID: "103"
      SENSOR_TYPE: env

  logto-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: logto
      POSTGRES_PASSWORD: logto
      POSTGRES_DB: logto
    volumes:
      - logto-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logto"]
      interval: 5s
      timeout: 5s
      retries: 10

  # IDP. 사용자 로그인(3001) / 관리 콘솔(3002). 최초 접속 시 콘솔에서 관리자 계정을 만든다.
  logto:
    image: svhd/logto:1.45.0
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    ports:
      - "3001:3001"
      - "3002:3002"
    environment:
      TRUST_PROXY_HEADER: "1"
      DB_URL: postgres://logto:logto@logto-postgres:5432/logto
      # 브라우저에서 접근하는 주소. OIDC issuer 가 ENDPOINT/oidc 가 된다.
      ENDPOINT: http://localhost:3001
      ADMIN_ENDPOINT: http://localhost:3002
    depends_on:
      logto-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/status').then(r=>process.exit(r.ok||r.status===204?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  grafana:
    image: grafana/grafana-oss:11.6.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # 개발용 org(1) <-> dev tenant 데이터소스 계정. seeds/dev_grafana_role.sql 이 만든다.
      # 다른 tenant 는 scripts/provision_tenant.sh <tenant_id> 로 role 을 만든다. role -> tenant 는 tenant_role 이 정한다.
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_dev}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
      # Logto(OIDC) 로그인. ID 토큰/userinfo의 organizations claim -> Grafana org 매핑.
      #   GRAFANA_OAUTH_ORG_MAPPING = "<Logto organization id>:<Grafana org id>:<role>" (여러 개는 공백으로 구분)
      # 브라우저가 쓰는 URL(auth)은 localhost, Grafana 컨테이너가 쓰는 URL(token/api)은 compose 내부 주소다.
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OAUTH_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: Logto
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID:-}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email urn:logto:scope:organizations
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://localhost:3001/oidc/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://logto:3001/oidc/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://logto:3001/oidc/me
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: username || email || sub
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name || username
      GF_AUTH_GENERIC_OAUTH_ORG_ATTRIBUTE_PATH: organizations
      GF_AUTH_GENERIC_OAUTH_ORG_MAPPING: ${GRAFANA_OAUTH_ORG_MAPPING:-}
      # 매핑되지 않은 사용자가 기본 org(1)에 자동 배정되면 tenant 격리가 깨진다.
      GF_USERS_AUTO_ASSIGN_ORG: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
      logto:
        condition: service_healthy

  curl:
    image: curlimages/curl:latest
    entrypoint: ["curl", "-X", "PUT", "http://emulator:8000/config", "-H", "Content-Type: application/json", "-d", '{ "sensors": [ {"id": 101, "sensor_type": "tilt"}, {"id": 102, "sensor_type": "crack"}, {"id": 103, "sensor_type": "env"} ], "interval_seconds": 1.0, "jitter_fraction": 0.1, "topic_prefix": "sensors", "qos": 1 }']
    depends_on:
      emulator:
        condition: service_healthy

volumes:
  prometheus-data:
  broker1-data:
  postgres_data:
  grafana-data:
  logto-postgres-data:
