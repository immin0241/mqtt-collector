# 시연(EC2) 오버레이. 기본 스택 위에 얹어서 쓴다:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.demo.yml
#   docker compose up -d --build
# 필요한 환경 변수(.env): PUBLIC_HOST, CONTROL_TOKEN  (docs/demo-runbook.md)
services:
  # 센서 9개를 실시간으로 발행한다. 재시작해도 seq·구성이 이어지고, 발행 로그와 정답 파일을 남긴다.
  emulator:
    restart: unless-stopped
    environment:
      SEED: "7"
      SEQ_STATE: /data/seq_state.json
      PUBLISH_LOG: /data/publish.jsonl
      TRUTH_LOG: /data/truth.jsonl
      INITIAL_CONFIG: /demo/emulator-config.json
      # 포트를 공개하므로 토큰이 없으면 기동하지 않는다.
      CONTROL_TOKEN: ${CONTROL_TOKEN:?CONTROL_TOKEN is required when ports are public}
    volumes:
      - ./demo/emulator-config.json:/demo/emulator-config.json:ro
      - emulator-data:/data

  # 기존 개발용 3센서 구성 주입기는 쓰지 않는다. (INITIAL_CONFIG 가 대신한다)
  curl:
    profiles: ["disabled"]

  # 기본 시드 뒤에 시연용 시드(demo/seeds)도 적용한다. scenario_sensors.sql 은 제외한다.
  seed:
    volumes:
      - ./seeds:/seeds:ro
      - ./demo/seeds:/demo-seeds:ro
    command:
      - |
        set -e
        for f in /seeds/*.sql /demo-seeds/*.sql; do
          # 개발용 시나리오 센서(201~210)는 시연 대시보드에 "unknown" 으로 섞이므로 건너뛴다.
          [ "$$(basename "$$f")" = scenario_sensors.sql ] && continue
          echo "applying $$f"
          psql -v ON_ERROR_STOP=1 -v worker_password="$$APP_WORKER_PASSWORD" -v grafana_password="$$GRAFANA_DB_PASSWORD" -v api_password="$$API_DB_PASSWORD" -f "$$f"
        done

  app:
    restart: unless-stopped

  api:
    restart: unless-stopped
    environment:
      API_ISSUER: http://${PUBLIC_HOST:?PUBLIC_HOST is required}:3001/oidc

  # 브라우저가 쓰는 주소를 공개 주소로 맞춘다. issuer 는 ENDPOINT/oidc 이므로 토큰의 iss 도 이 값이 된다.
  logto:
    restart: unless-stopped
    environment:
      ENDPOINT: http://${PUBLIC_HOST:?PUBLIC_HOST is required}:3001
      ADMIN_ENDPOINT: http://${PUBLIC_HOST}:3002

  grafana:
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: http://${PUBLIC_HOST:?PUBLIC_HOST is required}:3000
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://${PUBLIC_HOST}:3001/oidc/auth

  broker1:
    restart: unless-stopped
  postgres:
    restart: unless-stopped
  prometheus:
    restart: unless-stopped

volumes:
  emulator-data:
